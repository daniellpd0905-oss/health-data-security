<h2 id="part1">研究需要讀摘要，該核准哪些操作？</h2>
<p>最小權限（least privilege）是把可執行的操作限在任務所需的範圍。審核員可先確認「研究要完成什麼」，再逐項確認需要讀哪些欄位、是否需要將資料帶出環境。<a href="sources/S01.html">S01，AC-6 Control 與 Discussion</a></p>
<p><strong>案例。</strong> 研究團隊最初希望共用金鑰並在院外整理摘要。審核時要求列出實際操作者、所需欄位與資料流向。最終只准個別帳號在核可環境讀取指定欄位，匯出須另審。<a href="../raw/CASE.html">CASE 原始申請與授權範圍</a></p>
