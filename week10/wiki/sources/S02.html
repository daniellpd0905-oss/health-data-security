<p>美國國家標準與技術研究院（NIST），Zero Trust Architecture，SP 800-207，2020 年 8 月。查 Abstract 中說明 implicit trust 的段落。<a href="https://csrc.nist.gov/pubs/sp/800/207/final">官方摘要</a></p>
<p><strong>原文支持。</strong> 零信任（zero trust）架構下，單靠網路位置不足以信任使用者或裝置。建立對資源的工作階段前，須驗證使用者和裝置，並判斷授權。</p>
<p><strong>適用界線。</strong> 教材用研究入口舉例。核准帳號、三天期限與唯讀條件都依<a href="../../raw/CASE.html">虛構案例 CASE</a>。</p>
