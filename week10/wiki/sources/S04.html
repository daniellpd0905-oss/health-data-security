<p>OWASP，Logging Cheat Sheet（線上版，2026-11-19 查閱），Event attributes、Data to exclude、Protection。<a href="https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html">官方原文</a></p>
<p><strong>原文支持。</strong> 日誌要能重建事件的時間、來源、操作者與行為。以關聯識別碼串起同一請求的紀錄，限制日誌查閱並保護其完整性。一般日誌應避免直接寫入密碼、完整權杖或健康資料。</p>
<p><strong>適用界線。</strong> 能從單筆拒絕推論到哪裡，取決於該筆事件記錄的動作。調查其他操作時須另外查證。</p>
